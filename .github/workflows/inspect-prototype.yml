name: Inspect provided game prototype
on:
  push:
    paths:
      - '.github/workflows/inspect-prototype.yml'
      - 'game_platform-claude-sleepy-cannon-xcyut8 (2).zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely index and extract human-readable source files
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, os, pathlib, shutil, collections
          archive = 'game_platform-claude-sleepy-cannon-xcyut8 (2).zip'
          out = pathlib.Path('prototype-reference')
          out.mkdir(exist_ok=True)
          exts={'.html','.js','.jsx','.ts','.tsx','.css','.scss','.json','.md','.txt','.svg','.xml','.yaml','.yml','.toml','.config','.mjs','.cjs'}
          listed=[]
          written=[]
          total=0
          maxbytes=14*1024*1024
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name=info.filename
                  listed.append((name, info.file_size, info.compress_size))
                  path=pathlib.PurePosixPath(name)
                  if info.is_dir() or path.is_absolute() or '..' in path.parts or '\\' in name: continue
                  if any(c in path.parts for c in ('node_modules','.git','dist','.next','build','coverage','.cache')): continue
                  if path.suffix.lower() not in exts or info.file_size>1000000 or info.file_size<=0: continue
                  if total+info.file_size>maxbytes or len(written)>=170: continue
                  payload=z.read(info)
                  try: payload.decode('utf-8')
                  except UnicodeDecodeError: continue
                  target=out.joinpath(*path.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(payload)
                  written.append((str(target),info.file_size))
                  total+=info.file_size
          lines=['# Prototype Archive Inspection','',f'Archive: `{archive}`',f'Entries: {len(listed)}; extracted source files: {len(written)}; extracted bytes: {total}','', '## Archive tree','']
          lines += [f'- `{n}` ({sz} bytes, compressed {csz})' for n,sz,csz in listed[:450]]
          lines += ['', '## Text source files available for review','']
          lines += [f'- `{p}` ({s} bytes)' for p,s in written]
          pathlib.Path('SOURCE_AUDIT.md').write_text('\n'.join(lines),encoding='utf8')
          print('Indexed',len(listed),'entries; extracted',len(written),'text files')
          PY
      - name: Commit audit for review
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_AUDIT.md prototype-reference
          if ! git diff --cached --quiet; then
            git commit -m "Extract prototype source for game redesign review"
            git push
          fi
