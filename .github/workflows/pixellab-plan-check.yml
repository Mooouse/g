name: PixelLab Plan Validation
on:
  push:
    paths:
      - 'tools/pixellab_plan.py'
      - 'tools/generate_pixellab.py'
      - 'tools/activate_pixellab.py'
      - '.github/workflows/pixellab-v2.yml'
      - '.github/workflows/pixellab-plan-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4
      - name: Dry-run without any PixelLab credits
        shell: bash
        run: |
          python -m py_compile tools/pixellab_plan.py tools/generate_pixellab.py tools/activate_pixellab.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from pixellab_plan import assets,ORDER
          assert len(assets)==36 and len(ORDER)==24
          assert len({a.name for a in assets})==36
          for a in assets:
              assert all(x>0 for x in a.size)
              assert a.size[0]<=192 and a.size[1]<=128
          print('PASS: 36 planned PixelLab calls, 24 instrument tiers, 12 UI sprites, four reserve')
          PY
          node --check art.js
          node --check game.js
          node tests/smoke.cjs
