name: Build Individual Pixel Art Assets
on:
  push:
    paths:
      - 'tools/paint_assets.py'
      - '.github/workflows/build-pixel-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render separate native-pixel PNGs
        run: |
          python -m pip install Pillow==11.3.0
          python tools/paint_assets.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          items={
            "keyboard_1":(64,64),"keyboard_2":(64,64),"ukulele_1":(64,64),
            "drums_1":(64,64),"drums_2":(128,128),
            "guitar_1":(64,128),"guitar_2":(64,128),
            "background_tile":(64,64),"cell":(64,64),
            "metal_block":(64,64),"boss_block":(128,128),
            "scanner":(16,64),"charge_button":(128,48),"sparkle":(16,16),
            "settings_icon":(32,32),"shop_icon":(32,32),"pause_icon":(32,32),
            "coin":(24,24),"result_panel":(128,64)}
          for name,dim in items.items():
            p=Path('assets/pixel')/(name+'.png')
            with Image.open(p) as im:
              assert im.size==dim,(name,im.size,dim)
              assert im.mode=='RGBA',name
          print('PASS',len(items),'independent pixel sprites at native game-grid sizes')
          PY
      - name: Commit assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pixel/
          if ! git diff --cached --quiet; then
            git commit -m 'Render distinct hand-authored pixel-art PNG assets'
            for retry in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
