name: PixelLab Art Batch — 36 of 40
on:
  push:
    branches: [main]
    paths:
      - 'triggers/pixellab-full-20261028.txt'
      - 'triggers/pixellab-resume-20261028.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'pilot = one test sprite; full = finish remaining 36 sprites, no live release'
        required: true
        type: choice
        options:
          - pilot
          - full
        default: pilot
      retry_failed:
        description: 'Use reserved attempts only after reviewing a failed API call'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pixellab-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check for private API key
        env:
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
        run: |
          if [ -z "$PIXELLAB_API_KEY" ]; then
            echo 'Missing PIXELLAB_API_KEY repository secret. No credits spent.'
            exit 1
          fi
      - name: Prepare isolated checkpoint branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin generated/pixellab-v1 > /dev/null; then
            git fetch origin generated/pixellab-v1
            git checkout -B generated/pixellab-v1 FETCH_HEAD
          else
            git checkout -b generated/pixellab-v1
            git push origin HEAD:generated/pixellab-v1
          fi
          # The staging branch was created during the one-image pilot.
          # Merge latest safe generator fixes and tests from main first.
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:generated/pixellab-v1
      - name: Install PNG validator and HTTPS client
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4
      - name: Generate and checkpoint (never exceed 36 paid calls)
        env:
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
          PIXELLAB_MODE: ${{ github.event_name == 'push' && 'full' || inputs.mode }}
          PIXELLAB_RETRY_FAILED: ${{ github.event_name == 'push' && 'true' || inputs.retry_failed }}
        run: python tools/generate_pixellab.py
      - name: Validate full set and stage new levels without touching live game
        if: ${{ github.event_name == 'push' || inputs.mode == 'full' }}
        shell: bash
        run: |
          python tools/activate_pixellab.py
          node --check art.js
          node --check game.js
          node tests/smoke.cjs
          git add assets/pixellab/ art.js game.js index.html
          git commit -m 'Stage reviewed PixelLab art assets and 24 game instrument levels'
          git push origin HEAD:generated/pixellab-v1
      - name: Attach artwork archive for later review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixellab-generated-art
          path: assets/pixellab/
          if-no-files-found: ignore
          retention-days: 90
