name: Deploy Melody Scanner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run automated gameplay tests
        run: |
          node --check art.js
          node --check game.js
          node --check sample-audio.js
          node --check drag-planner.js
          node --check roulette-logic.js
          node --check concert-theme.js
          node --check vendor/mojs/mo.umd.js
          node --check mojs-game-fx.js
          node tests/mojs-fx.cjs
          node tests/roulette.cjs
          node tests/drag-planner.cjs
          node tests/smoke.cjs
          node tests/audio.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep only artifacts from the latest successful build
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Artifacts for the current run stay available for download.
          # Previous runs' artifacts are no longer needed after success.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, (.workflow_run.id // 0)] | @tsv' \
            > "${RUNNER_TEMP}/artifact-list.tsv"
          while IFS=$'\t' read -r artifact_id run_id; do
            if [[ "${run_id}" != "${GITHUB_RUN_ID}" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              echo "Removed old artifact ${artifact_id} (run ${run_id})"
            fi
          done < "${RUNNER_TEMP}/artifact-list.tsv"
