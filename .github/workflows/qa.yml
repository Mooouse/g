name: GRIDSONATA QA report
on:
  push:
    paths:
      - 'app.js'
      - 'audio.js'
      - 'visuals.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute and record smoke tests
        shell: bash
        run: |
          set +e
          node --check visuals.js > /tmp/check-art.txt 2>&1
          ART=$?
          node --check audio.js > /tmp/check-audio.txt 2>&1
          AUD=$?
          node --check app.js > /tmp/check-game.txt 2>&1
          APP=$?
          node tests/smoke.cjs > /tmp/smoke.txt 2>&1
          SMOKE=$?
          {
            echo "# GRIDSONATA automated test report"
            echo ""
            printf "Source commit: %s\\n" "$(git rev-parse HEAD)"
            printf "Node: %s\\n" "$(node --version)"
            echo ""
            echo "| Check | Exit code |"
            echo "| --- | ---: |"
            echo "| Vector artwork JS syntax | $ART |"
            echo "| Audio JS syntax | $AUD |"
            echo "| Game JS syntax | $APP |"
            echo "| Gameplay simulation | $SMOKE |"
            echo ""
            echo "### Game test output"
            printf '%s\\n' '~~~'
            cat /tmp/smoke.txt
            printf '%s\\n' '~~~'
          } > QA_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QA_STATUS.md
          git commit -m "Record automated GRIDSONATA smoke test outcome"
          git push
          test "$ART" -eq 0 && test "$AUD" -eq 0 && test "$APP" -eq 0 && test "$SMOKE" -eq 0
