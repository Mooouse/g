name: Melody Scanner QA
on:
  push:
    paths:
      - 'index.html'
      - 'game.js'
      - 'art.js'
      - 'style.css'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate art, game and gameplay
        shell: bash
        run: |
          set -o pipefail
          node --check art.js
          node --check game.js
          node --check sample-audio.js
          node tests/smoke.cjs
          node tests/audio.cjs
      - name: Attach QA summary to this run (no race-prone Git commits)
        if: always()
        shell: bash
        run: |
          {
            printf '# Melody Scanner QA\n\n'
            printf 'Git commit: %s\n' "$(git rev-parse HEAD)"
            printf 'Node: %s\n' "$(node --version)"
            printf 'View the step results in this workflow run.\n'
          } > QA_RUN_REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: melody-game-qa-report
          path: QA_RUN_REPORT.md
          retention-days: 30
