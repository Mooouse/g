name: Music Crates automated QA
on:
  push:
    paths:
      - 'index.html'
      - 'style.css'
      - 'instruments.js'
      - 'game.js'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests and save report
        shell: bash
        run: |
          set +e
          node --check instruments.js > /tmp/sprites.txt 2>&1
          ART=$?
          node --check game.js > /tmp/game.txt 2>&1
          GAME=$?
          node tests/smoke.cjs > /tmp/smoke.txt 2>&1
          SMOKE=$?
          {
            echo '# Music Crates QA'
            echo ''
            printf 'Commit: %s\n' "$(git rev-parse HEAD)"
            printf 'Node: %s\n' "$(node --version)"
            echo ''
            echo '| Test | Exit code |'
            echo '| --- | ---: |'
            printf '| Sprite syntax | %s |\n' "$ART"
            printf '| Game syntax | %s |\n' "$GAME"
            printf '| Gameplay smoke tests | %s |\n' "$SMOKE"
            echo ''
            echo '### Test output'
            printf '%s\n' '~~~'
            cat /tmp/smoke.txt
            printf '%s\n' '~~~'
          } > QA_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QA_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Music Crates QA results"
            git push
          fi
          test "$ART" -eq 0 && test "$GAME" -eq 0 && test "$SMOKE" -eq 0
