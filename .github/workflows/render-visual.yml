name: Render gameplay visual test
on:
  push:
    paths:
      - '.github/workflows/render-visual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Check desktop and portrait gameplay pixels
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          f='index.html'
          s=open(f,encoding='utf8').read().replace('<script defer src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>','')
          open(f,'w',encoding='utf8').write(s)
          PY
          python3 -m http.server 8989 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          sleep 2
          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          timeout 22s "$CHROME" --headless=new --disable-background-networking --no-sandbox --disable-dev-shm-usage --no-first-run --window-size=1400,800 --screenshot=/tmp/desktop.png http://127.0.0.1:8989/ > /tmp/dlog 2>&1
          timeout 22s "$CHROME" --headless=new --disable-background-networking --no-sandbox --disable-dev-shm-usage --no-first-run --window-size=430,900 --screenshot=/tmp/mobile.png http://127.0.0.1:8989/ > /tmp/mlog 2>&1
          base64 -w0 /tmp/desktop.png > VIEW_DESKTOP.txt
          base64 -w0 /tmp/mobile.png > VIEW_MOBILE.txt
          git checkout -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VIEW_DESKTOP.txt VIEW_MOBILE.txt
          git commit -m "Temporary reference screenshot QA" && git push

# Validate sprites remain legible during scan
