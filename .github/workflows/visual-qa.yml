name: Browser screenshot QA
on:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'concert-theme.js'
      - 'roulette-logic.js'
      - 'art.js'
      - 'assets/pixel/**'
      - 'tools/remaster_pixel_assets.py'
      - 'style.css'
      - 'index.html'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
concurrency:
  group: browser-visual-qa
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Take screenshots
        shell: bash
        run: |
          # Avoid remote SDK/font loads so the capture is deterministic.
          sed -i 's#<script defer src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>##' index.html
          sed -i "1{/^@import /d}" style.css
          python3 -m http.server 8321 --bind 127.0.0.1 >/tmp/screenshot-server.log 2>&1 &
          sleep 2
          mkdir -p docs/qa-screenshots
          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          set +e
          timeout 16s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --no-first-run --hide-scrollbars --window-size=1650,928 --force-device-scale-factor=2 --screenshot=/tmp/desktop.png http://127.0.0.1:8321/?preview=1 >/tmp/desktop.log 2>&1
          D=$?
          timeout 16s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --no-first-run --hide-scrollbars --window-size=430,850 --force-device-scale-factor=2 --screenshot=/tmp/mobile.png http://127.0.0.1:8321/?preview=1 >/tmp/mobile.log 2>&1
          M=$?
          timeout 16s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --no-first-run --hide-scrollbars --window-size=1650,928 --force-device-scale-factor=2 --screenshot=/tmp/menu.png http://127.0.0.1:8321/ >/tmp/menu.log 2>&1
          N=$?
          set -e
          test -s /tmp/desktop.png
          test -s /tmp/mobile.png
          test -s /tmp/menu.png
          cp /tmp/desktop.png docs/qa-screenshots/desktop.png
          cp /tmp/mobile.png docs/qa-screenshots/mobile.png
          cp /tmp/menu.png docs/qa-screenshots/menu.png
          printf 'Desktop Chrome exit: %s\nMobile Chrome exit: %s\n' "$D" "$M" > docs/qa-screenshots/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: browser-pixel-art-screenshots
          path: docs/qa-screenshots/
          retention-days: 14

      - name: Save latest visual QA screenshots without binary merge conflicts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # HTML/CSS are modified in-place only for the offline capture.
          git restore -- index.html style.css
          for retry in 1 2 3 4 5; do
            git fetch origin main
            # Keep the newly generated PNGs in the working tree, base the
            # commit directly on the latest branch; never rebase binary PNGs.
            git reset --mixed origin/main
            git add docs/qa-screenshots/desktop.png docs/qa-screenshots/mobile.png docs/qa-screenshots/menu.png docs/qa-screenshots/status.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Capture desktop and mobile Concert Edition game boards"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
