name: Visual QA Canvas Preview
on:
  push:
    paths:
      - '.github/workflows/visual-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Render and record previews
        shell: bash
        run: |
          python3 -m http.server 8989 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          sleep 2
          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          set +e
          timeout 90s "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=4000 --window-size=1650,928 --screenshot=/tmp/desktop.png http://127.0.0.1:8989/ > /tmp/chrome-desktop.log 2>&1
          RESULT_DESKTOP=$?
          timeout 90s "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=4000 --window-size=430,850 --screenshot=/tmp/mobile.png http://127.0.0.1:8989/ > /tmp/chrome-mobile.log 2>&1
          RESULT_MOBILE=$?
          printf '# Visual QA Results\n\nChrome executable: %s\nDesktop render: %s\nMobile render: %s\n' "$CHROME" "$RESULT_DESKTOP" "$RESULT_MOBILE" > VISUAL_RESULT.md
          if command -v convert >/dev/null; then
            convert /tmp/desktop.png -resize 1000x -quality 70 /tmp/preview-desktop.jpg 2>>/tmp/chrome-desktop.log
            convert /tmp/mobile.png -resize 450x -quality 70 /tmp/preview-mobile.jpg 2>>/tmp/chrome-mobile.log
          else
            ffmpeg -v error -y -i /tmp/desktop.png -vf scale=1000:-1 -q:v 9 /tmp/preview-desktop.jpg
            ffmpeg -v error -y -i /tmp/mobile.png -vf scale=430:-1 -q:v 9 /tmp/preview-mobile.jpg
          fi
          if test -f /tmp/preview-desktop.jpg; then base64 -w0 /tmp/preview-desktop.jpg > VISUAL_DESKTOP_BASE64.txt; fi
          if test -f /tmp/preview-mobile.jpg; then base64 -w0 /tmp/preview-mobile.jpg > VISUAL_MOBILE_BASE64.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VISUAL_RESULT.md VISUAL_*_BASE64.txt || true
          if ! git diff --cached --quiet; then git commit -m "Store temporary browser visual review captures"; git push; fi
          test "$RESULT_DESKTOP" -eq 0 && test "$RESULT_MOBILE" -eq 0
