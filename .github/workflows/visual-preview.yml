name: Visual QA Canvas Preview
on:
  push:
    paths:
      - '.github/workflows/visual-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Render preview without waiting for external SDK
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          path='index.html'
          html=open(path,encoding='utf8').read()
          html=html.replace('<script defer src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>', '')
          open(path,'w',encoding='utf8').write(html)
          css='style.css'
          content=open(css,encoding='utf8').read()
          content=content.replace("@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800;900&display=swap');", '')
          open(css,'w',encoding='utf8').write(content)
          PY
          python3 -m http.server 8989 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          sleep 2
          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          timeout 18s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --no-first-run --hide-scrollbars --window-size=1100,650 --screenshot=/tmp/desktop.png http://127.0.0.1:8989/ >/tmp/desktop.log 2>&1
          RESULT_DESKTOP=$?
          timeout 18s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --no-first-run --hide-scrollbars --window-size=440,900 --screenshot=/tmp/mobile.png http://127.0.0.1:8989/ >/tmp/mobile.log 2>&1
          RESULT_MOBILE=$?
          {
            printf '# Visual QA Results\n\nDesktop render: %s\nMobile render: %s\n' "$RESULT_DESKTOP" "$RESULT_MOBILE"
            printf '\n### Desktop Chrome log\n\n~~~\n'
            tail -8 /tmp/desktop.log
            printf '\n~~~\n### Mobile Chrome log\n\n~~~\n'
            tail -8 /tmp/mobile.log
            printf '\n~~~\n'
          } > VISUAL_RESULT.md
          if test -s /tmp/desktop.png; then base64 -w0 /tmp/desktop.png > VISUAL_DESKTOP_BASE64.txt; fi
          if test -s /tmp/mobile.png; then base64 -w0 /tmp/mobile.png > VISUAL_MOBILE_BASE64.txt; fi
          git checkout -- index.html style.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VISUAL_RESULT.md
          for file in VISUAL_DESKTOP_BASE64.txt VISUAL_MOBILE_BASE64.txt; do if test -f "$file"; then git add "$file"; fi; done
          if ! git diff --cached --quiet; then git commit -m "Save temporary browser screenshots for visual check"; git push; fi
          test "$RESULT_DESKTOP" -eq 0 && test "$RESULT_MOBILE" -eq 0
