<!doctype html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7452c9"><meta name="description" content="Собирай музыкальные инструменты, запускай звуковой сканер, разрушай металлические блоки.">
<title>Melody Scanner — Musical Merge Arcade</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script defer src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<script defer src="art.js?rev=pixellab-v1-24-levels"></script>
<script defer src="game.js?rev=pixellab-v1-24-levels"></script>
</head>
<body><div id="viewport">
<canvas id="game" width="1650" height="928" role="application" aria-label="Musical grid game"></canvas>
<div id="tapHint" class="tip hidden"></div>
<div id="panel" class="panel hidden"><div class="panel-header"><h2 id="panelTitle">Настройки</h2><button id="closePanel" aria-label="Закрыть">✕</button></div>
<div id="settingsContent" class="settings-content">
<label><span id="volText">Громкость</span><input id="volume" type="range" min="0" max="100" value="65"></label>
<label><span id="musicText">Фоновая музыка</span><input id="music" type="range" min="0" max="100" value="38"></label>
<label><span id="langText">Язык</span><select id="language"><option value="ru">Русский</option><option value="en">English</option><option value="es">Español</option></select></label>
</div>
<div id="shopContent" class="shop-content hidden"><div class="shop-subtitle" id="shopSubtitle">Улучшай звук и скорость сканера</div><div id="upgradeOptions"></div></div>
<div id="panelFooter" class="panel-footer">♫</div></div>
</div>
</body></html>
