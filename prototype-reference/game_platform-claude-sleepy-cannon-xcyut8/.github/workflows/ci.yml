# Platform CI: types, unit tests, every game and docs example valid, generated docs up to date,
# the kids kit's example (Balloon Pop, docs/examples/kids) builds and passes its full browser QA.
name: CI

on:
  push:
    paths-ignore:
      - 'publisher/**'
      - 'docs/research/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress: a burst of commits costs one run, not ten
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Types, tests, games valid, docs up to date
        run: npm run check

      - name: Web build of the kids kit's example and of every game made inside the platform (games/<id>, if any)
        run: |
          for f in docs/examples/kids/game.yaml games/*/game.yaml; do
            [ -f "$f" ] || continue
            node packages/cli/src/gp.ts build "$f" || exit 1
          done

      - name: Browser for QA
        run: npx playwright install --with-deps chromium

      - name: The real engines the adapters and Rapier the physics block are tested against (installed only in their test folder)
        run: npm ci --prefix packages/core/test-browser/engines-real --no-audit --no-fund

      - name: Component tests in the browser (the shop screen, the engine adapters on the real engines, the physics block on real Rapier, a physics game's one-file build)
        run: npm run test:browser

      - name: QA of the kids kit's example (Balloon Pop)
        run: node packages/cli/src/gp.ts qa docs/examples/kids/game.yaml

      - name: QA of the casual kit example (CrazyGames channel) and its portal package
        run: |
          node packages/cli/src/gp.ts qa docs/examples/casual.game.yaml
          node packages/cli/src/gp.ts build docs/examples/casual.game.yaml --target crazygames

      - name: QA of the code kit example (a game with its own code) and its portal package
        run: |
          node packages/cli/src/gp.ts qa docs/examples/code/game.yaml
          node packages/cli/src/gp.ts build docs/examples/code/game.yaml --target crazygames

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: qa-reports
          retention-days: 3
          path: |
            docs/examples/kids/qa/
            docs/examples/qa/
            docs/examples/code/qa/
