# yaml-language-server: $schema=../../packages/spec/schema/game.schema.json
# Made by a fresh agent from AGENTS.md alone in 8 minutes (docs/team/decisions.md §4). Kept as an example, not for release.
# "Vroom Balloons" — toddlers (2–4) pop balloons carrying vehicles (car, bus, train, plane, boat, tractor,
# fire truck, bike…) or farm animals; the voice names each one. Rewards: an album of vehicle stickers.

spec: 0
id: vehicle-balloons
title: "Vroom Balloons"
appId: com.qma.vehicleballoons # never change after the first release
locale: en-US
audience: ages-2-5
channel: android-families
kit: kids
theme: sky-balloons
privacyPolicyUrl: https://qmacyber.github.io/vehicle-balloons/privacy-policy.html

round:
  mechanic: tap-collect
  goal: 12                                      # a short round: a natural stop well under a minute
  maxOnScreen: 5
  spawnEvery: [0.6, 1.1]
  trajectory: { type: rise, time: [6.5, 8.5] }  # slow balloons for 2–4 year olds
  target: { radius: 0.12, min: 44, max: 100 }   # a bit bigger than the default: the emoji must read as a vehicle
  celebrateSec: 1.6

modes:
  - id: vehicles
    items:
      - { emoji: "🚗", word: car }
      - { emoji: "🚌", word: bus }
      - { emoji: "🚂", word: train }
      - { emoji: "✈️", word: plane }
      - { emoji: "⛵", word: boat }
      - { emoji: "🚜", word: tractor }
      - { emoji: "🚒", word: fire truck }
      - { emoji: "🚲", word: bike }
      - { emoji: "🚁", word: helicopter }
      - { emoji: "🚀", word: rocket }
      - { emoji: "🚑", word: ambulance }
      - { emoji: "🚓", word: police car }
      - { emoji: "🚕", word: taxi }
      - { emoji: "🚚", word: truck }
    card: { preview: [{ color: 0, emoji: "🚒" }, { color: 2, emoji: "🚌" }, { color: 4, emoji: "🚜" }] }
  - id: farm
    items:
      - { emoji: "🐮", word: cow }
      - { emoji: "🐷", word: pig }
      - { emoji: "🐑", word: sheep }
      - { emoji: "🐴", word: horse }
      - { emoji: "🐔", word: chicken }
      - { emoji: "🦆", word: duck }
      - { emoji: "🐐", word: goat }
      - { emoji: "🐰", word: bunny }
      - { emoji: "🐶", word: dog }
      - { emoji: "🐱", word: cat }
      - { emoji: "🐤", word: chick }
    card: { preview: [{ color: 3, emoji: "🐮" }, { color: 6, emoji: "🐷" }, { color: 1, emoji: "🐑" }] }

menu: { backgroundTargets: 4 }

rewards:
  # Own vehicle-themed album: one sticker per round.
  stickers: ["🚗", "🚕", "🚙", "🚌", "🚎", "🚓", "🚑", "🚒", "🚐", "🚚", "🚛", "🚜",
             "🚲", "🚂", "🚆", "🚇", "🚊", "🚝", "🚁", "🚀", "⛵", "🚤", "🚢", "🚦"]
  praise: ["Beep beep! Well done!", "Vroom! Great job!", "Hooray!"]

monetization:
  ads: { appId: auto, interstitial: auto } # gp admob provision fills these in
  removeAds: { product: remove_ads }
