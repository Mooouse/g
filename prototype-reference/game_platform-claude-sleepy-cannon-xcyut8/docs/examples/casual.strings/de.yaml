subtitle: "45 Sekunden. Schnell tippen. Keine Stacheln!"
listing:
  description: "Pop Rush ist eine 45-Sekunden-Punktejagd: Lass leuchtende Kugeln so schnell wie möglich platzen. Schnelle Treffer bauen eine Combo bis ×5 auf, goldene Kugeln zählen mehr und Stachelkugeln kosten drei Sekunden. Gegen Ende werden die Kugeln schneller. Schlag deinen Rekord. (Ein Beispiel der Plattform, kein Spiel zur Veröffentlichung.)"
  controls: "Maus: Klicke auf die Kugeln. Touch: Tippe auf die Kugeln."
