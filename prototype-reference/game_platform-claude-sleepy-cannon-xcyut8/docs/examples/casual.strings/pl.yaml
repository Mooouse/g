subtitle: "45 sekund. Przebijaj szybko. Unikaj kolców!"
listing:
  description: "Pop Rush to 45-sekundowy wyścig po punkty: przebijaj świecące kule najszybciej, jak potrafisz. Szybkie trafienia budują combo do ×5, złote kule są warte więcej, a kolczaste zabierają trzy sekundy. Pod koniec kule przyspieszają. Pobij swój rekord. (Przykład platformy, nie gra do wydania.)"
  controls: "Mysz: klikaj kule. Dotyk: dotykaj kul."
