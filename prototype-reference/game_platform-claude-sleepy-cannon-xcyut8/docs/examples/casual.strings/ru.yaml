subtitle: "45 секунд. Лопайте быстро. Берегитесь шипов!"
listing:
  description: "Pop Rush — гонка за очками на 45 секунд: лопайте светящиеся шары как можно быстрее. Быстрые попадания набирают комбо до ×5, золотые шары стоят больше, а шипастые отнимают три секунды. К концу шары ускоряются. Побейте свой рекорд. (Пример платформы, а не игра для выпуска.)"
  controls: "Мышь: щёлкайте по шарам. Касание: нажимайте на шары."
