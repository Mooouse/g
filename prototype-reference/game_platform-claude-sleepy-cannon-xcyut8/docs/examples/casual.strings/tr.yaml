subtitle: "45 saniye. Hızlı patlatın. Dikenlerden kaçın!"
listing:
  description: "Pop Rush 45 saniyelik bir puan yarışı: parlayan küreleri olabildiğince hızlı patlatın. Hızlı patlatmalar ×5’e kadar kombo yapar, altın küreler daha değerlidir, dikenli küreler ise süreden üç saniye götürür. Küreler sona doğru hızlanır. Rekorunuzu kırın. (Bir platform örneği, yayınlanacak bir oyun değil.)"
  controls: "Fare: kürelere tıklayın. Dokunmatik: kürelere dokunun."
