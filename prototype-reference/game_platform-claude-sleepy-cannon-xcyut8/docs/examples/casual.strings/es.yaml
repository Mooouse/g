subtitle: "45 segundos. Explota rápido. ¡Evita los pinchos!"
listing:
  description: "Pop Rush es una carrera de puntos de 45 segundos: explota orbes brillantes lo más rápido que puedas. Las explosiones rápidas forman un combo de hasta ×5, los orbes dorados valen más y los orbes con pinchos te quitan tres segundos. Los orbes aceleran hacia el final. Supera tu mejor puntuación. (Un ejemplo de la plataforma, no un juego para publicar.)"
  controls: "Ratón: haz clic en los orbes. Táctil: toca los orbes."
