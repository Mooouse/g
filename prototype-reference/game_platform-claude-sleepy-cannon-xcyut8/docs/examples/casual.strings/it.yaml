subtitle: "45 secondi. Scoppia veloce. Evita le spine!"
listing:
  description: "Pop Rush è una corsa ai punti di 45 secondi: fai scoppiare le sfere luminose più in fretta che puoi. Gli scoppi rapidi creano una combo fino a ×5, le sfere dorate valgono di più e quelle con le spine tolgono tre secondi al tempo. Verso la fine le sfere accelerano. Batti il tuo record. (Un esempio della piattaforma, non un gioco da pubblicare.)"
  controls: "Mouse: clicca sulle sfere. Touch: tocca le sfere."
