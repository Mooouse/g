subtitle: "45 detik. Pecahkan cepat. Hindari duri!"
listing:
  description: "Pop Rush adalah lomba skor 45 detik: pecahkan bola bercahaya secepat mungkin. Pecahan cepat membangun kombo hingga ×5, bola emas bernilai lebih, dan bola berduri mengurangi tiga detik dari waktu. Bola makin cepat menjelang akhir. Kalahkan skor terbaikmu. (Contoh platform, bukan game untuk dirilis.)"
  controls: "Mouse: klik bola. Sentuh: ketuk bola."
