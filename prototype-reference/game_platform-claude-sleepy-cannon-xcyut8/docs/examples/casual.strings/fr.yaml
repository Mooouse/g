subtitle: "45 secondes. Éclatez vite. Évitez les pics !"
listing:
  description: "Pop Rush est une course aux points de 45 secondes : éclatez des orbes lumineux le plus vite possible. Les éclats rapides font grimper un combo jusqu’à ×5, les orbes dorés valent plus et les orbes à pics retirent trois secondes au chrono. Les orbes accélèrent vers la fin. Battez votre meilleur score. (Un exemple de la plateforme, pas un jeu à publier.)"
  controls: "Souris : cliquez sur les orbes. Tactile : touchez les orbes."
