subtitle: "45 segundos. Estoure rápido. Evite os espinhos!"
listing:
  description: "Pop Rush é uma corrida de pontos de 45 segundos: estoure orbes brilhantes o mais rápido que puder. Estouros rápidos formam um combo de até ×5, orbes dourados valem mais e orbes com espinhos tiram três segundos do relógio. Os orbes aceleram perto do fim. Supere sua melhor pontuação. (Um exemplo da plataforma, não um jogo para lançamento.)"
  controls: "Mouse: clique nos orbes. Toque: toque nos orbes."
