listing:
  description: "Germ Dodge ist ein kleines Überlebensspiel: Steuere eine Zelle durch einen Schwarm von Keimen, die von allen Rändern kommen und immer schneller werden, je länger du durchhältst. Ein Finger oder die Pfeiltasten, keine Menüs im Weg. Schlag deine Bestzeit. (Ein Beispiel der Plattform, kein Spiel zur Veröffentlichung.)"
