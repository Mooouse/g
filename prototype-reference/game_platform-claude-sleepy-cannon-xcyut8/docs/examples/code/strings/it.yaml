listing:
  description: "Germ Dodge è un piccolo gioco di sopravvivenza: guida una cellula attraverso uno sciame di germi che arrivano da ogni bordo e accelerano più a lungo resisti. Un tocco o le frecce, nessun menu di mezzo. Batti il tuo tempo migliore. (Un esempio della piattaforma, non un gioco da pubblicare.)"
  controls: "Tastiera: WASD o frecce per muoverti, P per la pausa. Mouse o touch: trascina ovunque per guidare."
