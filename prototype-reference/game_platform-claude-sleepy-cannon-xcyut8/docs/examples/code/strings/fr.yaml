listing:
  description: "Germ Dodge est un petit jeu de survie : guidez une cellule à travers un essaim de germes qui arrivent de tous les bords et accélèrent à mesure que vous tenez. Un doigt ou les flèches, aucun menu en travers. Battez votre meilleur temps. (Un exemple de la plateforme, pas un jeu à publier.)"
