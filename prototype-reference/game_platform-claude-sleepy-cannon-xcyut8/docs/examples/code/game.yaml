# A game with its own code (kit: code): the example CI builds and tests. The mechanics, screens and drawing are in
# main.ts; the platform brings the channel rules, the CrazyGames SDK, ads, cloud saves, QA and the one-file upload (upload/index.html).
spec: 0
id: code-example
title: "Germ Dodge"
audience: general
channel: crazygames
kit: code
entry: main.ts
background: "#0f2230"
# The languages it ships in (docs/guides/i18n.md): the texts are in strings/<code>.yaml, the player's language is picked
# by its own choice (the title's picker), else CrazyGames' locale, else the browser's. `gp translate` lists what to translate
languages: [en, es, pt-BR, fr, de, ru, tr, it, pl, id]
# What makes it its own — written before building (CrazyGames reviews originality; `gp explain concept`).
# An example, not a release: its "different" is honest about how thin it is.
concept:
  pitch: "Steer a cell through a growing swarm of germs and survive as long as you can."
  closest: ["Dodge the Germs", "Circle Dodge", "Evades.io"]
  different: "Nothing yet: germs fly in straight lines from the edges and come faster over time. A platform example, never to be submitted as it is."
# The balance's anchor (docs/guides/upgrades.md → Start from time, then the anchor): the one number a dodger's balance
# converts into. Declared, a balanceModel() is held to the strict first-session checks; Germ Dodge has no economy yet, so
# no model (gp qa says so) — the anchor is where its first one starts.
balance:
  anchor: { name: "survival time", unit: "s", says: "how long a fresh player lasts against the swarm in one run" }
# Where it earns (`gp forecast`; docs/guides/game-design.md → Design for money). Honest about the example: short runs,
# one Continue, and only the best time to come back for (CrazyGames requires a return: E_MONEY_RETURN) — the validator
# warns about the session.
money:
  genre: hypercasual
  session: { minutes: 6, breaks: 5, breaksAt: "a hit ends the run → Play again" }
  rewarded:
    - { placement: continue, kind: continue, per: run, gives: "Continue the run once, with the germs cleared away" }
  returns: { kind: meta, what: "Only the best time to beat, kept between visits: thin — a real game adds a daily" }
# Music (a CrazyGames code game needs it: E_SOUND_MUSIC). Germ Dodge has only effects, and says so: a platform example
# is let through with a warning; gp review --check and gp submission would refuse it (createMusic: docs/examples/art).
sound: { music: false, why: "A platform example of the host contract, never submitted: effects only" }
# The portal form's texts (`gp submission` writes them into listing.md next to the files)
listing:
  description: "Germ Dodge is a tiny survival game: steer a cell through a swarm of germs that fly in from every edge and come faster the longer you last. One touch or the arrow keys, no menus in the way. Beat your best time. (A platform example, not a game for release.)"
  controls: "Keyboard: WASD or arrow keys to move, P to pause. Mouse or touch: drag anywhere to steer."
  orientation: both
  tags: [Casual, Arcade]
