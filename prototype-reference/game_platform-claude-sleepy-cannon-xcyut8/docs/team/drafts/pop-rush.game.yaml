# yaml-language-server: $schema=../../../packages/spec/schema/game.schema.json
# ЧЕРНОВИК (гейм-дизайнер). "Pop Rush" — простая казуальная игра для всех (13+), web.
# 45 секунд: лопай шары как можно быстрее. Серия быстрых попаданий = множитель ×2…×5.
# Золотой шар (+50) редкий, серый шипастый «ёж» — не трогать (−3 с и сброс серии).
# Шары ускоряются к концу. Итог: очки, рекорд, «New best!», повтор в один тап.
# kit: kids здесь НЕ подходит (замок, наклейки, «For parents») — нужен kit: casual.

spec: 0
id: pop-rush
title: "Pop Rush"
appId: com.qmacyber.poprush       # сейчас обязателен и для web; NEW: не требовать appId для web-only
locale: en-US
audience: general
channel: web
kit: casual                       # NEW: kit casual — title-экран (Play + рекорд) → раунд → результат → Play again
theme: sky-balloons               # работает; своя тема (neon-pop) — позже
saveKey: poprush.save.v1

round:
  mechanic: tap-score             # NEW: механика tap-score (очки вместо сбора до N; можно как режим tap-collect)
  goal: { time: 45 }              # NEW: goal-объект: { pops: N } | { time: сек }; сейчас goal — только число поп-ов
  maxOnScreen: 8
  spawnEvery: [0.35, 0.7]
  prefill: 3                      # игра идёт с первой секунды, без обратного отсчёта дольше 1 с
  countdown: 1                    # NEW: «Go!» 1 с (0 — сразу); 3-2-1 для 45-секундной игры — лишнее ожидание
  trajectory: { type: rise, time: [3.2, 4.5], sway: 0.1 }
  ramp:                           # NEW: ускорение внутри раунда (линейно от старта к концу)
    speed: 1.6                    #   к концу шары в 1.6 раза быстрее
    spawn: 1.4                    #   и появляются в 1.4 раза чаще
  target: { radius: 0.085, min: 26, max: 70 }
  targets:                        # NEW: виды целей с весами (сейчас все цели одинаковые)
    - { kind: normal,  weight: 88, score: 10 }
    - { kind: golden,  weight: 4,  score: 50, speed: 1.3 }                 # быстрее, но честно видно
    - { kind: spiky,   weight: 8,  score: 0, penalty: { time: -3, combo: reset } }
                                  #   валидатор: «плохая» цель отличается ФОРМОЙ (шипы/эмоджи), не только цветом
  combo:                          # NEW
    window: 0.9                   #   следующий поп в течение 0.9 с продолжает серию
    steps: [5, 10, 20, 35]        #   ×2 после 5 подряд, ×3 после 10, ×4 после 20, ×5 после 35
    missResets: false             #   упущенный шар серию не сбрасывает (сбрасывают пауза и «ёж»)
  emptyTap: none                  # NEW (см. catch-a-star): тап мимо — ничего (без штрафа: штраф за мимо = наказание за мультитач)
  hud: { score: top-right, timer: top-center, combo: near-target }   # NEW
  onboarding: { idleHint: hand, afterSec: 3, firstRunOnly: true }    # NEW
  celebrateSec: 0.8               # «Time!» — короткая пауза, чтобы тапы не нажали кнопку результата
  pauseOnHide: true               # NEW: вкладка скрыта → таймер стоп (для timed-игр — обязательно, QA)

modes:                            # для kit: casual один режим → меню пропускается (NEW: modes не обязательны)
  - id: classic
    items: [{ emoji: "🎈" }, { emoji: "🎈" }]   # сейчас modes/items обязательны; тут контент не нужен
    show: none
    pop: none
    say: false                    # голос на каждый поп для 13+ раздражает: дефолт должен зависеть от audience

result:                           # NEW: result-экран kit casual
  screen: score                   #   очки крупно, рекорд, «New best!» только при строгом превышении
  stats: [pops, bestCombo, accuracy]
  replay: one-tap                 #   «Play again» — самая большая кнопка, активна через 0.6 с
  share: false                    #   позже: скриншот результата (web share)

save:                             # NEW: что сохраняется локально
  best: score                     #   рекорд; без аккаунтов и серверов (§14 архитектуры)

monetization:
  ads: { enabled: false }         # web-канал: рекламы пока нет (E_ADS_UNSUPPORTED)
  removeAds: false
  # NEW позже (web-portal): rewarded ТОЛЬКО как явный выбор игрока вне раунда; никаких «continue за рекламу»
