# yaml-language-server: $schema=../../../packages/spec/schema/game.schema.json
# ЧЕРНОВИК (гейм-дизайнер). "Catch a Star" — игра №2 (GDD Balloon Pop §12, #3), ages 2–5.
# Звёзды медленно падают с вечернего неба; тап — звезда летит в банку внизу экрана,
# банка светится ярче, голос считает: "one!", "two!"... 12 звёзд — банка полная → праздник → награда.
# Всё без пометки `# NEW:` валидно по текущей схеме v0. `# NEW:` — чего не хватает.

spec: 0
id: catch-a-star
title: "Catch a Star!"
appId: com.babygames.catchastar
locale: en-US
audience: ages-2-5
channel: android-families
kit: kids
theme: night-sky                  # NEW: тема (фон вечернего неба, цель — звезда, палитра под colors-en, мягкий «дзынь»)
saveKey: catchastar.save.v1
privacyPolicyUrl: https://qmacyber.github.io/catch-a-star/privacy-policy.html

round:
  mechanic: tap-collect
  goal: 12                        # 12, а не 15: полёт в банку добавляет ~0.6 с на цель; раунд ~40–50 с
  maxOnScreen: 5                  # звёзды мельче шаров визуально → меньше на экране
  spawnEvery: [0.6, 1.1]
  prefill: 3                      # 3 звезды уже в верхней трети: первый тап в первую секунду
  trajectory:
    type: fall                    # NEW: траектория `fall` (сверху вниз), вместо const `rise`
    time: [6, 8]                  # медленнее шаров: падение «на ребёнка» выглядит быстрее, чем подъём
    sway: 0.25                    # звёзды слегка «планируют»
    spin: 0.3                     # NEW: вращение цели, об/с (0 — без вращения)
    stopAbove: jar                # NEW: цель не падает ЗА банку — исчезает, мягко угасая, на высоте банки
  target: { radius: 0.1, min: 40, max: 88 }
  collector:                      # NEW: блок `collector` — пойманная цель летит в «сосуд»
    type: jar                     #   jar | basket | net (картинка из темы)
    anchor: bottom-center         #   bottom-center | bottom-left | bottom-right
    flySec: 0.6                   #   время полёта цели в сосуд (easeInOut)
    fill: glow                    #   glow (банка светится ярче) | stack (цели видны внутри)
  hud: { progress: collector }    # NEW: прогресс раунда = сосуд (вместо ряда точек); `dots` — текущее поведение
  celebrateSec: 1.6               # банка «взрывается» звёздным салютом, без вспышек всего экрана
  onboarding:                     # NEW: подсказка первых секунд (нужна всем играм, см. doc §3)
    idleHint: hand                #   анимированная рука над ближайшей целью
    afterSec: 4                   #   если ни одного тапа за 4 с после старта раунда
  emptyTap: sparkle               # NEW: тап мимо цели → маленькая искорка (у малышей тап «в пустоту» — не ошибка)

modes:
  - id: count
    items:                        # текущая схема: inline-элементы; сама звезда без надписи
      - { emoji: "⭐" }
      - { emoji: "🌟" }
    show: none
    pop: none
    say: count                    # NEW: say: count — голос считает пойманные ("one", "two" ... "twelve"),
                                  #   сейчас `say` — boolean и произносит только item.word. Нужны number words до goal.
    card: { preview: [{ color: 2, label: "1" }, { color: 2, label: "2" }, { color: 2, label: "3" }] }
  - id: shapes
    content: shapes-en            # NEW: контент-пак shapes-en (circle, square, triangle, heart, star, moon, diamond)
    show: emoji                   #   только старые эмоджи: 🔴 ⬜ 🔺 ❤️ ⭐ 🌙 🔷 (не 🟦 — Emoji 12)
  - id: colors
    content: colors-en            # работает, если палитра night-sky = 7 цветов colors-en (E_COLOR_NOT_NAMED ловит)
  - id: space
    items:
      - { emoji: "🚀", word: rocket }
      - { emoji: "🌙", word: moon }
      - { emoji: "🪐", word: planet }   # ВНИМАНИЕ: 🪐 — Emoji 12 (2019), на Android 7–8 может не отрисоваться
      - { emoji: "☀️", word: sun }
      - { emoji: "☁️", word: cloud }
      - { emoji: "⭐", word: star }

menu: { backgroundTargets: 3 }

rewards:
  stickers: space-24              # NEW: пак наклеек space-24 (свой у каждой игры — политика Repetitive Content)
  praise: ["Well done!", "The jar is full!", "Super!"]

monetization:
  ads: { appId: auto, interstitial: auto }
  removeAds: { product: remove_ads }
